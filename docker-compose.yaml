services:
  oracle:
    image: container-registry.oracle.com/database/free:latest
    container_name: oracle-free
    ports:
      - "1521:1521"
    environment:
      ORACLE_PWD: "Str0ng!Passw0rd"
      ORACLE_CHARACTERSET: "AL32UTF8"
    volumes:
      - oracle-free-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM dual;' | sqlplus -s sys/Str0ng!Passw0rd@localhost:1521/FREEPDB1 as sysdba || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 30
    restart: unless-stopped

volumes:
  oracle-free-data: