# file: src/main/resources/db/changelog/changes/0002-audit-tables.yaml
databaseChangeLog:
  - changeSet:
      id: 0007-create-product-aud
      author: maxengineer90
      changes:
        - createTable:
            tableName: PRODUCT_AUD
            columns:
              - column:
                  name: PRODUCT_ID
                  type: NUMBER(19)
                  constraints:
                    nullable: false
              - column:
                  name: REV
                  type: NUMBER(19)
                  constraints:
                    nullable: false
              - column:
                  name: REVTYPE
                  type: NUMBER(3)
                  constraints:
                    nullable: false
              - column:
                  name: SKU
                  type: VARCHAR2(50 CHAR)
              - column:
                  name: NAME
                  type: VARCHAR2(255 CHAR)
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP(6)
        - addPrimaryKey:
            tableName: PRODUCT_AUD
            columnNames: PRODUCT_ID, REV
            constraintName: PK_PRODUCT_AUD
        - addForeignKeyConstraint:
            baseTableName: PRODUCT_AUD
            baseColumnNames: REV
            referencedTableName: REVINFO
            referencedColumnNames: REV
            constraintName: FK_PRODUCT_AUD_REV

