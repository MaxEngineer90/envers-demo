databaseChangeLog:
  - changeSet:
      id: 001-audit-schema-core
      author: demo
      changes:
        - createTable:
            tableName: REVINFO
            columns:
              - column:
                  name: REV
                  type: "NUMBER(19)"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: REVTSTMP
                  type: TIMESTAMP

        - createTable:
            tableName: CATEGORY_AUD
            columns:
              - column:
                  name: ID
                  type: "NUMBER(19)"
                  constraints:
                    nullable: false
              - column:
                  name: CODE
                  type: "VARCHAR2(50)"
              - column:
                  name: NAME
                  type: "VARCHAR2(150)"
              - column:
                  name: REV
                  type: "NUMBER(19)"
                  constraints:
                    nullable: false
              - column:
                  name: REVTYPE
                  type: "NUMBER(3)"
                  constraints:
                    nullable: false
              - column:
                  name: CODE_MOD
                  type: "NUMBER(1)"
              - column:
                  name: NAME_MOD
                  type: "NUMBER(1)"
        - addPrimaryKey:
            tableName: CATEGORY_AUD
            columnNames: ID, REV
            constraintName: PK_CATEGORY_AUD
        - addForeignKeyConstraint:
            baseTableName: CATEGORY_AUD
            baseColumnNames: REV
            referencedTableName: REVINFO
            referencedColumnNames: REV
            constraintName: FK_CATEGORY_AUD_REV
        # Index nur auf REV (FK-/Lookup-Index). Kein Duplikat zur PK.
        - createIndex:
            tableName: CATEGORY_AUD
            indexName: IDX_CATEGORY_AUD_REV
            columns:
              - column:
                  name: REV

        - createTable:
            tableName: SUPPLIER_AUD
            columns:
              - column:
                  name: ID
                  type: "NUMBER(19)"
                  constraints:
                    nullable: false
              - column:
                  name: CODE
                  type: "VARCHAR2(50)"
              - column:
                  name: NAME
                  type: "VARCHAR2(150)"
              - column:
                  name: REV
                  type: "NUMBER(19)"
                  constraints:
                    nullable: false
              - column:
                  name: REVTYPE
                  type: "NUMBER(3)"
                  constraints:
                    nullable: false
              - column:
                  name: CODE_MOD
                  type: "NUMBER(1)"
              - column:
                  name: NAME_MOD
                  type: "NUMBER(1)"
        - addPrimaryKey:
            tableName: SUPPLIER_AUD
            columnNames: ID, REV
            constraintName: PK_SUPPLIER_AUD
        - addForeignKeyConstraint:
            baseTableName: SUPPLIER_AUD
            baseColumnNames: REV
            referencedTableName: REVINFO
            referencedColumnNames: REV
            constraintName: FK_SUPPLIER_AUD_REV
        - createIndex:
            tableName: SUPPLIER_AUD
            indexName: IDX_SUPPLIER_AUD_REV
            columns:
              - column:
                  name: REV

        - createTable:
            tableName: PRODUCT_AUD
            columns:
              - column:
                  name: ID
                  type: "NUMBER(19)"
                  constraints:
                    nullable: false
              - column:
                  name: SKU
                  type: "VARCHAR2(50)"
              - column:
                  name: NAME
                  type: "VARCHAR2(200)"
              - column:
                  name: CURRENT_PRICE
                  type: "NUMBER(15,2)"
              - column:
                  name: STATUS
                  type: "VARCHAR2(30)"
              - column:
                  name: CATEGORY_ID
                  type: "NUMBER(19)"
              - column:
                  name: SUPPLIER_ID
                  type: "NUMBER(19)"
              - column:
                  name: REV
                  type: "NUMBER(19)"
                  constraints:
                    nullable: false
              - column:
                  name: REVTYPE
                  type: "NUMBER(3)"
                  constraints:
                    nullable: false
              - column:
                  name: SKU_MOD
                  type: "NUMBER(1)"
              - column:
                  name: NAME_MOD
                  type: "NUMBER(1)"
              - column:
                  name: CURRENT_PRICE_MOD
                  type: "NUMBER(1)"
              - column:
                  name: STATUS_MOD
                  type: "NUMBER(1)"
              - column:
                  name: CATEGORY_ID_MOD
                  type: "NUMBER(1)"
              - column:
                  name: SUPPLIER_ID_MOD
                  type: "NUMBER(1)"
        - addPrimaryKey:
            tableName: PRODUCT_AUD
            columnNames: ID, REV
            constraintName: PK_PRODUCT_AUD
        - addForeignKeyConstraint:
            baseTableName: PRODUCT_AUD
            baseColumnNames: REV
            referencedTableName: REVINFO
            referencedColumnNames: REV
            constraintName: FK_PRODUCT_AUD_REV
        - createIndex:
            tableName: PRODUCT_AUD
            indexName: IDX_PRODUCT_AUD_REV
            columns:
              - column:
                  name: REV