databaseChangeLog:
  - changeSet:
      id: 006-view-audit-supplier-flat
      author: demo
      runOnChange: true
      changes:
        - createView:
            viewName: V_SUPPLIER_AUD_FLAT
            replaceIfExists: true
            selectQuery: |
              SELECT
                ID,
                CODE,
                NAME,
                REV,
                REVTYPE,
                CODE_MOD,
                NAME_MOD
              FROM SUPPLIER_AUD