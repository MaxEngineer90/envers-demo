databaseChangeLog:
  - changeSet:
      id: 005-view-audit-category-flat
      author: demo
      runOnChange: true
      changes:
        - createView:
            viewName: V_CATEGORY_AUD_FLAT
            replaceIfExists: true
            selectQuery: |
              SELECT
                ID,
                CODE,
                NAME,
                REV,
                REVTYPE,
                CODE_MOD,
                NAME_MOD
              FROM CATEGORY_AUD