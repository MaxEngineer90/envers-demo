spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: ENVERS_DEMO_SCHEMA
    password: Str0ng!Passw0rd
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: ENVERS_DEMO_SCHEMA
        show_sql: true
        format_sql: true
        use_sql_comments: true
      org:
        hibernate:
          envers:
            audit_table_suffix: _AUD
            global_with_modified_flag: true
            track_entities_changed_in_revision: true
            store_data_at_delete: true
  liquibase:
    default-schema: ENVERS_DEMO_SCHEMA
    liquibase-schema: ENVERS_DEMO_SCHEMA
    change-log: classpath:db/changelog/db.changelog-master.yaml
    contexts: dev

logging:
  level:
    root: INFO
    de.ml.tutorials.envers.demo: DEBUG
    org.springframework: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.type.descriptor.jdbc: TRACE
    org.hibernate.envers: DEBUG
    org.hibernate.engine.transaction.internal.TransactionImpl: DEBUG
    liquibase.executor: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{40} - %msg%n"
